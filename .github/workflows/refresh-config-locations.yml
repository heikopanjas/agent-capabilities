name: Refresh coding-agent config locations

# Runs weekly: re-researches the agents documented in
# coding-agent-config-locations.md and commits any verified updates
# back into that same file on main. The git history is the changelog.
#
# Requires repo secret CLAUDE_CODE_OAUTH_TOKEN (Settings -> Secrets and
# variables -> Actions -> New repository secret). Generate it locally with
# `claude setup-token` (needs a Claude Pro/Max subscription; usage counts
# against the subscription, not API credits). The token is valid for one
# year — regenerate and update the secret before it expires.

on:
  schedule:
    - cron: "0 6 * * 4" # weekly, Thursday at 06:00 UTC
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write # commit the refreshed document to main
  id-token: write # required by claude-code-action to mint an OIDC token

concurrency:
  group: refresh-config-locations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute date
        id: vars
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # Attempt 1 — soft-fails so a transient API 529 ("Overloaded") does
      # not lose the day's run; the retry below picks it up.
      - name: Research and refresh document
        id: attempt1
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model claude-sonnet-5
            --allowedTools WebSearch,WebFetch,Read,Write,Edit,Glob,Grep
          prompt: |
            You are refreshing a reference document about coding-agent
            configuration locations.

            1. Read `coding-agent-config-locations.md` in the repository root.
               It uses confidence markers (star = spec/stable, diamond =
               documented current, circle = observed).
            2. For every agent in that document (Claude Code, Codex CLI, Antigravity CLI,
               GitHub Copilot, Cursor, Mistral Vibe, OpenCode, Pi, Aider,
               Cline, Continue, Devin, Gemini CLI, Goose, Hermes Agent, Kiro,
               OpenHands, Windsurf / Devin Desktop) and the cross-agent
               standards section, use WebSearch and WebFetch to
               verify the current state of each config path, file convention,
               skill/subagent location, and CLI behavior against the official
               documentation linked in each "Sources" block.
            3. Update `coding-agent-config-locations.md` IN PLACE with any
               path, flag, or behavior that has changed. Preserve the
               document's structure, tables, confidence markers, and
               "Sources" lists. Do NOT create any new files.
               Tables list the Project (repo) column first, then Global
               (user); keep that order.
               Record only the CURRENT configuration state: file paths,
               file formats and frontmatter fields, precedence and
               discovery rules, env vars, and CLI flags that control
               configuration. Write each entry as a terse present-tense
               fact in your own words.
               Do NOT include: changelog or release-note text (quoted or
               paraphrased), version numbers or release dates for when
               something was added, changed, deprecated, or fixed, "no
               longer" / "previously" / "formerly" history, bug or issue
               references, or product news and marketing. Git history is
               the changelog. If a path or behavior changed, replace the
               old entry with the new state; do not annotate the change.
               If an existing entry already contains such history, strip
               it while you are there, keeping only the configuration
               facts. A version number is acceptable only where a
               config feature is unavailable without a minimum version
               and users need that to configure it correctly.
            4. Set the trailing "Last verified" line to today's date
               (${{ steps.vars.outputs.date }}).
            5. Do NOT run git, and do NOT create commits, branches, or pull
               requests. Only edit the file in place — a later workflow step
               handles committing.

      # The action exits 0 even when Claude itself errors out (e.g. a bad API
      # key fails on turn 1 for $0), so the step outcome alone cannot be
      # trusted. Inspect the result event in the execution log instead.
      - name: Check attempt 1 result
        id: check1
        env:
          CLAUDE_OUTPUT: ${{ steps.attempt1.outputs.execution_file }}
        run: |
          if [ -z "$CLAUDE_OUTPUT" ] || [ ! -f "$CLAUDE_OUTPUT" ]; then
            echo "No execution output from attempt 1 — treating as failure."
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Both attempts write the same execution file, so keep attempt 1's
          # copy before a retry overwrites it (uploaded as an artifact below).
          mkdir -p "$RUNNER_TEMP/claude-transcripts"
          cp "$CLAUDE_OUTPUT" "$RUNNER_TEMP/claude-transcripts/attempt1.json"
          ERR=$(jq -s 'flatten | map(select(.type=="result")) | last | .is_error' "$CLAUDE_OUTPUT" 2>/dev/null)
          echo "attempt 1 is_error=$ERR"
          if [ "$ERR" = "false" ]; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      # Wait out a brief capacity blip before retrying.
      - name: Cool-down before retry
        if: steps.check1.outputs.failed == 'true'
        run: sleep 120

      # Attempt 2 — only runs if attempt 1 errored. Also soft-fails; the
      # verification step below is what fails the job for real.
      - name: Research and refresh document (retry)
        id: attempt2
        if: steps.check1.outputs.failed == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model claude-sonnet-5
            --allowedTools WebSearch,WebFetch,Read,Write,Edit,Glob,Grep
          prompt: |
            You are refreshing a reference document about coding-agent
            configuration locations.

            1. Read `coding-agent-config-locations.md` in the repository root.
               It uses confidence markers (star = spec/stable, diamond =
               documented current, circle = observed).
            2. For every agent in that document (Claude Code, Codex CLI, Antigravity CLI,
               GitHub Copilot, Cursor, Mistral Vibe, OpenCode, Pi, Aider,
               Cline, Continue, Devin, Gemini CLI, Goose, Hermes Agent, Kiro,
               OpenHands, Windsurf / Devin Desktop) and the cross-agent
               standards section, use WebSearch and WebFetch to
               verify the current state of each config path, file convention,
               skill/subagent location, and CLI behavior against the official
               documentation linked in each "Sources" block.
            3. Update `coding-agent-config-locations.md` IN PLACE with any
               path, flag, or behavior that has changed. Preserve the
               document's structure, tables, confidence markers, and
               "Sources" lists. Do NOT create any new files.
               Tables list the Project (repo) column first, then Global
               (user); keep that order.
               Record only the CURRENT configuration state: file paths,
               file formats and frontmatter fields, precedence and
               discovery rules, env vars, and CLI flags that control
               configuration. Write each entry as a terse present-tense
               fact in your own words.
               Do NOT include: changelog or release-note text (quoted or
               paraphrased), version numbers or release dates for when
               something was added, changed, deprecated, or fixed, "no
               longer" / "previously" / "formerly" history, bug or issue
               references, or product news and marketing. Git history is
               the changelog. If a path or behavior changed, replace the
               old entry with the new state; do not annotate the change.
               If an existing entry already contains such history, strip
               it while you are there, keeping only the configuration
               facts. A version number is acceptable only where a
               config feature is unavailable without a minimum version
               and users need that to configure it correctly.
            4. Set the trailing "Last verified" line to today's date
               (${{ steps.vars.outputs.date }}).
            5. Do NOT run git, and do NOT create commits, branches, or pull
               requests. Only edit the file in place — a later workflow step
               handles committing.

      # The action hides Claude's transcript from the job log. Keep it as a
      # short-lived artifact so a bad run can be diagnosed afterwards
      # (Actions tab -> run -> Artifacts). Note: artifacts of a public repo
      # can be downloaded by any signed-in GitHub user.
      - name: Collect Claude transcripts
        if: always()
        env:
          ATTEMPT2_OUTPUT: ${{ steps.attempt2.outputs.execution_file }}
        run: |
          mkdir -p "$RUNNER_TEMP/claude-transcripts"
          if [ -n "$ATTEMPT2_OUTPUT" ] && [ -f "$ATTEMPT2_OUTPUT" ]; then
            cp "$ATTEMPT2_OUTPUT" "$RUNNER_TEMP/claude-transcripts/attempt2.json"
          fi
          ls -la "$RUNNER_TEMP/claude-transcripts"

      - name: Upload Claude transcripts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: claude-transcripts-${{ steps.vars.outputs.date }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-transcripts/
          retention-days: 14
          if-no-files-found: warn

      # Ground truth: fail the job if the effective Claude run still errored,
      # so a dead API key surfaces as a red ✕ instead of a silent green tick.
      # Uses attempt 2's log if the retry ran, otherwise attempt 1's.
      - name: Verify Claude succeeded
        env:
          CLAUDE_OUTPUT: ${{ steps.attempt2.outputs.execution_file || steps.attempt1.outputs.execution_file }}
        run: |
          if [ -z "$CLAUDE_OUTPUT" ] || [ ! -f "$CLAUDE_OUTPUT" ]; then
            echo "::error::Claude produced no execution output — the run did not complete."
            exit 1
          fi
          ERR=$(jq -s 'flatten | map(select(.type=="result")) | last | .is_error' "$CLAUDE_OUTPUT" 2>/dev/null)
          if [ "$ERR" != "false" ]; then
            echo "::error::Claude run reported is_error=$ERR — check the OAuth token (expired or revoked?), subscription usage limits, or model access. Failing so this is not masked as a successful run."
            jq -s 'flatten | map(select(.type=="result")) | last' "$CLAUDE_OUTPUT" 2>/dev/null || true
            exit 1
          fi
          echo "Claude run completed successfully (is_error=false)."
          # Surface which tools were refused, without needing the artifact.
          jq -rs 'flatten | map(select(.type=="result")) | last
                  | "turns=\(.num_turns) permission_denials=\((.permission_denials // []) | length)",
                    ((.permission_denials // [])[] | "  denied: \(.tool_name // "?")")' "$CLAUDE_OUTPUT" 2>/dev/null || true

      # A run can end "successfully" without touching the document (seen on
      # 2026-09-24 and 2026-10-09). Every real refresh sets the trailing
      # "Last verified" line to today, so require that before committing.
      - name: Verify document was refreshed
        env:
          TODAY: ${{ steps.vars.outputs.date }}
        run: |
          FILE="coding-agent-config-locations.md"
          if ! grep -qx "\*Last verified: ${TODAY}\*" "$FILE"; then
            echo "::error::Claude finished without updating $FILE — expected '*Last verified: ${TODAY}*', found '$(grep -m1 'Last verified' "$FILE" || echo none)'. Download the claude-transcripts artifact to see what it did."
            git --no-pager diff --stat -- "$FILE" || true
            exit 1
          fi
          echo "Document refreshed:"
          git --no-pager diff --stat -- "$FILE"

      - name: Commit refreshed document
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILE="coding-agent-config-locations.md"
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "No changes to $FILE — nothing to commit."
          else
            git commit -m "Weekly refresh: re-verify coding-agent config locations"
            # claude-code-action rewrites the origin remote with its own
            # short-lived token, so a bare `git push` fails auth. Push via an
            # explicit GITHUB_TOKEN URL instead (contents: write covers this).
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
